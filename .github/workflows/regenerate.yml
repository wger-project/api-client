name: Regenerate client

# Refreshes the schema from a running instance, regenerates the client, and
# opens a pull request with the result. Review the diff, merge, then bump the
# version and tag the release locally.

on:
  workflow_dispatch:
    inputs:
      base-url:
        description: 'Instance to read the schema from'
        required: false
        default: 'https://wger.de'

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH: regenerated-client

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --group dev

      - name: Refresh the schema
        env:
          WGER_BASE_URL: ${{ inputs.base-url }}
        run: uv run python scripts/sync_schema.py

      - name: Regenerate the client
        run: scripts/generate.sh

      # The pull request will not run the CI workflow: commits made with
      # GITHUB_TOKEN do not trigger further workflows. Run the same checks here,
      # so the branch is already verified when someone looks at it.
      - name: Verify
        run: |
          scripts/generate.sh --check
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest

      # Staging first, because a new endpoint adds untracked files that
      # "git diff" alone would not notice.
      - name: Look for changes
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo 'The schema has not moved, nothing to commit'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git --no-pager diff --cached --stat
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Push the branch
        if: steps.diff.outputs.changed == 'true'
        env:
          BASE_URL: ${{ inputs.base-url }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git commit -m 'Refresh the schema and regenerate' \
                     -m "Generated from ${BASE_URL} by the regenerate workflow."
          git push --force origin "$BRANCH"

      # Force pushing keeps one pull request that gets updated, instead of
      # collecting one per run.
      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_URL: ${{ inputs.base-url }}
        run: |
          cat > /tmp/pr-body.md <<EOF
          Generated from \`${BASE_URL}\`.

          Review the diff of \`schema/wger-openapi.yaml\` for removed endpoints, changed
          response types, new required parameters and renamed \`operationId\` values.
          A rename will also change the s name in the generated client, which breaks its
          consumers even when the API itself did not change.

          After merging:
          * bump the version \`uv version x.y.z\`
          * update the changelog
          * tag the version \`git tag x.y.z && git push origin x.y.z\` 
          * make a release \`gh release create x.y.z --generate-notes\`
          EOF

          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr comment "$BRANCH" --body-file /tmp/pr-body.md
            echo 'Updated the existing pull request.'
          else
            gh pr create \
              --base master \
              --head "$BRANCH" \
              --title 'Refresh the schema and regenerate the client' \
              --body-file /tmp/pr-body.md
          fi

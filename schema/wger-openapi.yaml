    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    headlessJwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the allauth headless endpoints
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oidcAuth:
      type: oauth2
      description: Access token issued by the OAuth2/OIDC provider
      flows:
        authorizationCode:
          authorizationUrl: /identity/o/authorize
          tokenUrl: /identity/o/api/token
          scopes:
            api:read: View your training, nutrition and body data
            api:write: Add and change your training, nutrition and body data
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
servers:
- url: /
  description: This server
- url: https://wger.de
  description: The "official" upstream wger instance
tags:
- name: exercise
  description: The exercise database. Related objects are referenced by ID. This is
    the writable endpoint of the two exercise representations.
- name: exerciseinfo
  description: 'The same exercises read-only, with categories, muscles, equipment,
    images, videos and translations expanded inline. Meant for external tools and
    integrations: one request returns everything, with no IDs left to resolve.'
- name: ingredient
  description: Nutritional information per ingredient, referencing related objects
    by ID. Read-only and rate limited.
- name: ingredientinfo
  description: 'The same ingredients read-only, with language, license, image and
    weight units expanded inline. Meant for external tools and integrations: one request
    returns everything, with no IDs left to resolve.'
- name: ingredient-sync
  description: The same data as ingredientinfo, but cursor paginated for mirroring
    the whole catalogue. No `count`, and only `next`/`previous` rather than arbitrary
    offsets. Combine with the `last_update__gt` filter for incremental syncs.
- name: nutritionplan
  description: Nutrition plans, referencing meals and items by ID.
- name: nutritionplaninfo
  description: The same plans read-only, with meals, items and their nutritional values
    expanded inline. Meant for external tools and integrations that want a whole plan
    in one request, with no IDs left to resolve.
- name: routine
  description: Workout routines. The nested day, slot and config structure is available
    in one request under `/routine/{id}/structure/`.
- name: templates
  description: Read-only view of the routines the user marked as a template, plus
    their trainer's, if they have one.
- name: public-templates
  description: Read-only view of the routine templates published by other users.
- name: weight-config
  description: Weight for a set, per iteration.
- name: max-weight-config
  description: Upper limit for the weight of a set, per iteration.
- name: repetitions-config
  description: Repetitions for a set, per iteration.
- name: max-repetitions-config
  description: Upper limit for the repetitions of a set, per iteration.
- name: sets-config
  description: Number of sets, per iteration.
- name: max-sets-config
  description: Upper limit for the number of sets, per iteration.
- name: rest-config
  description: Rest between sets, per iteration.
- name: max-rest-config
  description: Upper limit for the rest between sets, per iteration.
- name: rir-config
  description: Reps in reserve for a set, per iteration.
- name: max-rir-config
  description: Upper limit for the reps in reserve of a set, per iteration.
externalDocs:
  url: https://wger.readthedocs.io
  description: wger documentation

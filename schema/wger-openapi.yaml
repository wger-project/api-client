paths:
  /api/v2/check-language/:
    post:
      operationId: check_language_create
      description: Checks the language of a string
      tags:
      - check-language
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanguageCheckRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LanguageCheckRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LanguageCheckRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageCheckResponse'
          description: ''
        '400':
          description: The input could not be detected as the given language, or the
            language itself is unknown
  /api/v2/check-permission/:
    get:
      operationId: check_permission_retrieve
      description: Checks whether the user has a django permission
      parameters:
      - in: query
        name: permission
        schema:
          type: string
        description: The name of the django permission such as "exercises.change_muscle"
        required: true
      tags:
      - check-permission
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionResponse'
          description: ''
        '400':
          description: Please pass a permission name in the 'permission' parameter
